name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: 0 5 1,15 * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && (true) }}

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  MPLBACKEND: agg
  UV_COMPILE_BYTECODE: '1'
  COVERAGE_FILE: ${{ github.workspace }}/.coverage
  # TODO: remove once hatch is compatible with virtualenv 21+ (pypa/hatch#2193)
  UV_CONSTRAINT: ${{ github.workspace }}/.github/uv-constraints.txt

defaults:
  run:
    # to fail on error in multiline statements (-e), in pipes (-o pipefail), and on unset variables (-u).
    shell: bash -euo pipefail {0}

jobs:
  ensure-data-is-cached:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      with:
        filter: blob:none
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990   # v8.3.2
      with:
        enable-cache: false
        python-version: '3.14'

    - name: Restore data cache
      id: data-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
      with:
        path: data   # IMPORTANT: this will fail if scanpy.settings.datasetdir default changes
        key: data-${{ hashFiles('**/download_data.py') }}
        restore-keys: |
          data-
        enableCrossOsArchive: true

    - name: Download datasets
        # Always run to ensure any missing files are downloaded
        # (restore-keys may provide partial cache)
      run: uvx hatch run data:download

  # Get the test environment from hatch as defined in pyproject.toml.
  # This ensures that the pyproject.toml is the single point of truth for test definitions and the same tests are
  # run locally and on continuous integration.
  # Check [[tool.hatch.envs.hatch-test.matrix]] in pyproject.toml and https://hatch.pypa.io/latest/environment/ for more details.
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  get-environments:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      with:
        filter: blob:none
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990   # v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Get test environments
      id: get-envs
      run: |
        ENVS_JSON=$(NO_COLOR=1 uvx --quiet hatch env show --json | jq -c 'to_entries
          | map(
              select(.key | startswith("hatch-test"))
              | {
                  name: .key,
                  label: (if (.key | contains("pre")) then .key + " (PRE-RELEASE DEPENDENCIES)" else .key end),
                  python: .value.python
                }
            )')
        echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  # Run tests through hatch. Spawns a separate runner for each environment defined in the hatch matrix obtained above.
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  test:
    needs:
    - ensure-data-is-cached
    - get-environments
    - alpha_bridge_inputs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
        exclude:
        - os: macos-latest
          env: {name: hatch-test.py3.12-stable}
        - os: macos-latest
          env: {name: hatch-test.py3.14-pre}     # pre-release only needs one OS
        - os: ubuntu-latest
          env: {name: hatch-test.py3.14-stable}     # skipping because we run this as a coverage job
    name: ${{ matrix.env.label }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ contains(matrix.env.name, 'pre') }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      with:
        filter: blob:none
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990   # v8.3.2
      with:
        python-version: ${{ matrix.env.python }}
        cache-dependency-glob: pyproject.toml

    - name: Ensure figure directory exists
      run: mkdir -p "$GITHUB_WORKSPACE/tests/figures"

    - name: Restore data cache
      id: data-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
      with:
        path: data   # IMPORTANT: this will fail if scanpy.settings.datasetdir default changes
        key: data-${{ hashFiles('**/download_data.py') }}
        restore-keys: |
          data-
        enableCrossOsArchive: true

    - name: System dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y
        sudo apt-get install automake -y

        # PyQt5 related
        sudo apt install libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 -y
        sudo Xvfb :42 -screen 0 1920x1080x24 -ac +extension GLX </dev/null &

    - name: System dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install automake

    - name: create hatch environment
      run: uvx hatch env create ${{ matrix.env.name }}

    - name: run tests using hatch
      env:
        PLATFORM: ${{ matrix.os }}
        DISPLAY: :42
      run: uvx hatch run ${{ matrix.env.name }}:run -v --color=yes -n auto

    - name: Archive figures generated during testing
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
      with:
        name: visual_test_results_${{ runner.os }}_${{ matrix.env.name }}
        path: ${{ github.workspace }}/tests/figures/*

    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  coverage:
    name: Coverage (ubuntu-latest, hatch-test.py3.14-stable)
    needs:
    - ensure-data-is-cached
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for codecov OIDC
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
      with:
        filter: blob:none
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990   # v8.3.2
      with:
        python-version: '3.14'
        cache-dependency-glob: pyproject.toml

    - name: Ensure figure directory exists
      run: mkdir -p "$GITHUB_WORKSPACE/tests/figures"

    - name: Restore data cache
      id: coverage-data-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
      with:
        path: data   # IMPORTANT: this will fail if scanpy.settings.datasetdir default changes
        key: data-${{ hashFiles('**/download_data.py') }}
        restore-keys: |
          data-
        enableCrossOsArchive: true

    - name: System dependencies (Linux)
      run: |
        sudo apt-get update -y
        sudo apt-get install automake -y

        # PyQt5 related
        sudo apt install libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 -y
        sudo Xvfb :42 -screen 0 1920x1080x24 -ac +extension GLX </dev/null &

    - name: create hatch environment
      run: uvx hatch env create hatch-test.py3.14-stable

    - name: run coverage tests
      env:
        PLATFORM: ubuntu-latest
        DISPLAY: :42
      run: |
        uvx hatch run hatch-test.py3.14-stable:cov-erase
        uvx hatch run hatch-test.py3.14-stable:run-cov -v --color=yes
        uvx hatch run hatch-test.py3.14-stable:cov-combine
        uvx hatch run hatch-test.py3.14-stable:cov-report

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f   # v7.0.0
      with:
        use_oidc: true
        fail_ci_if_error: true


  # Check that all tests defined above pass. This makes it easy to set a single "required" test in branch
  # protection instead of having to update it frequently. See https://github.com/re-actors/alls-green#why.
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  check:
    name: Tests pass in all hatch environments
    if: ${{ (always()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    needs:
    - get-environments
    - test
    - coverage
    - alpha_bridge_inputs
    runs-on: ubuntu-latest
    steps:
    - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe   # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ github.sha }}
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"head_sha\": current[\"head_sha\"],\n            \"\
        event\": event,\n            \"per_page\": 100,\n        }\n    )\n    runs
        = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_sha\") != current[\"head_sha\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"configuration_commit\": os.environ[\"AB_HEAD_SHA\"\
        ],\n        \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
