name: Alpha Bridge exact-SHA CI
run-name: Alpha Bridge afdcfb860257

on:
  push:
    branches:
      - evidence/ci-afdcfb860257-d128ee91fc06

permissions:
  contents: read

concurrency:
  group: alpha-bridge-afdcfb860257
  cancel-in-progress: false

jobs:
  validate:
    name: Exact candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: afdcfb86025705553a6c560fe691f1be5fc45d12
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "afdcfb86025705553a6c560fe691f1be5fc45d12"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: "Install uv"
        shell: bash
        run: |
          python -m pip install uv

      - name: "Install test environment"
        shell: bash
        run: |
          uv sync --group test

      - name: "Run focused plotting compatibility tests"
        shell: bash
        run: |
          uv run python -m pytest tests/plotting/test_var_by_distance_plot.py tests/plotting/test_spatial_static.py::test_scanpy_plotting_legacy_layout tests/plotting/test_spatial_static.py::test_scanpy_plotting_released_layout tests/plotting/test_spatial_static.py::test_scanpy_plotting_layout_preserves_import_errors tests/plotting/test_spatial_static.py::test_scanpy_plotting_setting_compatibility tests/plotting/test_spatial_static.py::TestSpatialStatic::test_plot_spatial_scatter_group tests/plotting/test_spatial_static.py::TestSpatialStatic::test_plot_spatial_segment -q --tb=short
