name: Alpha Bridge exact-SHA CI
run-name: Alpha Bridge 56826629a9a7

on:
  push:
    branches:
      - evidence/ci-56826629a9a7-f9226dc18760

permissions:
  contents: read

concurrency:
  group: alpha-bridge-56826629a9a7
  cancel-in-progress: false

jobs:
  validate:
    name: Exact candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 56826629a9a780f62c38d03ef4d885cd312c43a4
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "56826629a9a780f62c38d03ef4d885cd312c43a4"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: "Install uv"
        shell: bash
        run: |
          python -m pip install uv

      - name: "Install test environment"
        shell: bash
        run: |
          uv sync --group test

      - name: "Run focused plotting compatibility tests"
        shell: bash
        run: |
          uv run python -m pytest tests/plotting/test_var_by_distance_plot.py tests/plotting/test_spatial_static.py::test_scanpy_plotting_setting_compatibility tests/plotting/test_spatial_static.py::TestSpatialStatic::test_plot_spatial_scatter_group tests/plotting/test_spatial_static.py::TestSpatialStatic::test_plot_spatial_segment -q --tb=short
